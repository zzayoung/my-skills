name: Birdsnest V2 experience verification
on:
  push:
    branches: [feat/birdsnest-v2-experience]
    paths: ['gallery-assets/birdsnest-v2/**', '.github/workflows/birdsnest-v2.yml']
permissions:
  contents: write
concurrency:
  group: birdsnest-v2
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read current gallery contract
        run: |
          curl --fail --location --max-time 35 'https://endless-gallery.zz-zzyoung.chatgpt.site/gallery/GALLERY_INTEGRATION.md' -o /tmp/gallery-integration.md && sha256sum /tmp/gallery-integration.md || echo 'PUBLIC_MARKDOWN_UNREACHABLE'
          curl --fail --location --max-time 35 'https://endless-gallery.zz-zzyoung.chatgpt.site/gallery/contract.json' -o /tmp/gallery-contract.json && cat /tmp/gallery-contract.json || echo 'PUBLIC_JSON_UNREACHABLE'
      - name: Install isolated build tools
        run: |
          cd gallery-assets/birdsnest-v2
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build complete offline files
        run: cd gallery-assets/birdsnest-v2 && npm run build
      - name: Verify actual desktop and touch interactions
        id: verify
        run: |
          cd gallery-assets/birdsnest-v2
          npm test || { cat evidence/acceptance.json; exit 1; }
      - name: Save evidence and passing distribution
        if: always()
        env:
          VERIFIED: ${{ steps.verify.outcome }}
        run: |
          if [ ! -f gallery-assets/birdsnest-v2/evidence/acceptance.json ]; then exit 0; fi
          git config user.name 'Birdsnest build'
          git config user.email 'actions@users.noreply.github.com'
          git add gallery-assets/birdsnest-v2/evidence
          if [ "$VERIFIED" = 'success' ]; then
            cd gallery-assets/birdsnest-v2
            zip -qr birdsnest-v2-experience.zip dist src tests build.mjs package.json package-lock.json DESIGN.md evidence
            mv birdsnest-v2-experience.zip dist/
            cd ../..
            git add gallery-assets/birdsnest-v2/dist gallery-assets/birdsnest-v2/package-lock.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m "build: Birdsnest V2 browser result $VERIFIED [skip ci]"
          git push origin HEAD:feat/birdsnest-v2-experience
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: birdsnest-v2-experience
          path: |
            gallery-assets/birdsnest-v2/dist
            gallery-assets/birdsnest-v2/evidence
          if-no-files-found: ignore
          retention-days: 30
