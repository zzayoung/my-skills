name: Birdsnest V2 experience verification
on:
  push:
    branches: [feat/birdsnest-v2-experience]
    paths: ['gallery-assets/birdsnest-v2/**', '.github/workflows/birdsnest-v2.yml']
permissions:
  contents: write
concurrency:
  group: birdsnest-v2
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the gallery integration contract
        run: |
          curl --fail --location --max-time 35 'https://endless-gallery.zz-zzyoung.chatgpt.site/gallery/GALLERY_INTEGRATION.md' -o /tmp/gallery-integration.md && head -c 60000 /tmp/gallery-integration.md || echo 'PUBLIC_CONTRACT_UNREACHABLE'
      - name: Install and build isolated experience
        run: |
          if [ ! -f gallery-assets/birdsnest-v2/package.json ]; then echo 'PREFLIGHT_ONLY'; exit 0; fi
          cd gallery-assets/birdsnest-v2
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
          npm test
      - name: Save generated experience and evidence
        if: success()
        run: |
          if [ ! -f gallery-assets/birdsnest-v2/dist/birdsnest-v2-offline.html ]; then exit 0; fi
          git config user.name 'Birdsnest build'
          git config user.email 'actions@users.noreply.github.com'
          git add gallery-assets/birdsnest-v2/dist gallery-assets/birdsnest-v2/evidence gallery-assets/birdsnest-v2/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: verified Birdsnest V2 distribution and evidence [skip ci]'
          git push origin HEAD:feat/birdsnest-v2-experience
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: birdsnest-v2-experience
          path: |
            gallery-assets/birdsnest-v2/dist
            gallery-assets/birdsnest-v2/evidence
          if-no-files-found: ignore
          retention-days: 30
