name: Birdsnest source refinement
on:
  push:
    branches: [feat/birdsnest-v2-experience]
    paths: ['.github/workflows/birdsnest-diagnostics.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed source refinements
        run: |
          python tools/birdsnest-finish.py
          git diff --stat
          git config user.name 'Birdsnest source refinement'
          git config user.email 'actions@users.noreply.github.com'
          git add gallery-assets/birdsnest-v2/src
          git commit -m 'design: portrait framing, full infield, consistent preview and movement substeps [skip ci]'
          git push origin HEAD:feat/birdsnest-v2-experience
